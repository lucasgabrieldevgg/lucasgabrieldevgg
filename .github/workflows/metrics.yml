name: métricas

on:
  schedule:
    - cron: '0 6 * * *'   # todo dia 06:00 UTC (03:00 em Cuiabá)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/metrics.yml']

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: 📊 geral
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PAT_METRICS }}
          filename: metrics/stats.svg
          config_timezone: America/Cuiaba
          config_display: large
          extras_css: |
            h2, h3 { color: #4ade80 !important; }
            svg { color: #c9d1d9 !important; }
            a { color: #4ade80 !important; }
          base: header, activity, community, repositories, metadata
          commits_authoring: lucasgabrieldevgg@users.noreply.github.com

      - name: 🗣️ linguagens
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PAT_METRICS }}
          filename: metrics/languages.svg
          config_timezone: America/Cuiaba
          config_display: large
          extras_css: |
            h2, h3 { color: #4ade80 !important; }
            svg { color: #c9d1d9 !important; }
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_colors: github
          commits_authoring: lucasgabrieldevgg@users.noreply.github.com

      - name: 📅 calendário do ano (isométrico, inclui ofensiva)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PAT_METRICS }}
          filename: metrics/calendar.svg
          config_timezone: America/Cuiaba
          config_display: large
          extras_css: |
            h2, h3 { color: #4ade80 !important; }
            svg { color: #c9d1d9 !important; }
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          commits_authoring: lucasgabrieldevgg@users.noreply.github.com
