name: métricas

on:
  schedule:
    - cron: '0 6 * * *'   # todo dia 06:00 UTC (03:00 em Cuiabá)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/metrics.yml']

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: 📊 geral (estilo stats card)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PAT_METRICS }}
          filename: metrics/stats.svg
          config_timezone: America/Cuiaba
          config_display: large
          config_colors: '{"background":"#00000000","title":"#4ade80","text":"#c9d1d9","accent":"#22c55e","line":"#22c55e"}'
          base: header, activity, community, repositories, metadata
          commits_authoring: lucasgabrieldevgg@users.noreply.github.com

      - name: 🗣️ linguagens (estilo top-langs)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PAT_METRICS }}
          filename: metrics/languages.svg
          config_timezone: America/Cuiaba
          config_display: large
          config_colors: '{"background":"#00000000","title":"#4ade80","text":"#c9d1d9","accent":"#22c55e"}'
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_colors: github
          commits_authoring: lucasgabrieldevgg@users.noreply.github.com

      - name: 🔥 ofensiva (estilo streak)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PAT_METRICS }}
          filename: metrics/streak.svg
          config_timezone: America/Cuiaba
          config_display: large
          config_colors: '{"background":"#00000000","title":"#4ade80","text":"#c9d1d9","accent":"#E3742F"}'
          base: ""
          plugin_streak: yes
          commits_authoring: lucasgabrieldevgg@users.noreply.github.com

      - name: 📅 calendário do ano (estilo activity graph)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PAT_METRICS }}
          filename: metrics/calendar.svg
          config_timezone: America/Cuiaba
          config_colors: '{"background":"#00000000","title":"#4ade80","text":"#c9d1d9","accent":"#22c55e"}'
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          commits_authoring: lucasgabrieldevgg@users.noreply.github.com
