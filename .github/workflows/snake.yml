name: gera a cobrinha
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: gera os SVGs da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: lucasgabrieldevgg
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#22c55e
      - name: publica na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
